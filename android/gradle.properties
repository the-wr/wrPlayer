# Pin the build to Android Studio's bundled JDK 21 (AGP-supported).
# System JAVA_HOME points at JDK 25, which AGP does not support.
org.gradle.java.home=C:/Program Files/Android/Android Studio1/jbr

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Disabled: AGP 8.7 has known config-cache serialization issues with source-set path tasks.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
